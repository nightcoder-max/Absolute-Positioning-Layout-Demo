<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
    .container{
        height:50px;
        width:80px;
        background-color: bisque;
        position: relative;
    }
    .box1{
        height:20px;
        width:20px;
        background-color:blue;
        position:absolute;
        margin:0;
        padding: 0;
    }
    .box2{
        height: 20px;
        width:20px;
        background-color: blue;
        position: absolute;
        margin: 0;
        padding: 0;
        top:30px;
    }
    .box3{
        height:20px;
        width:50px;
        background-color: blue;
        position: absolute;
        margin: 0;
        padding: 0;
        left:30px;
    }
    .box4{
        height:20px;
        width:50px;
        background-color: blue;
        position: absolute;
        margin: 0;
        padding: 0;
        left:30px;
        top:30px;
    }

    </style>
</head>
<body>
    <div class="container">
        <div class="box1">
        </div>
        <div class="box2"></div>
        <div class="box3"></div>
        <div class="box4"></div>
    </div>
</body>
</html>
